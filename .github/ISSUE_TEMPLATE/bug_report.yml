name: Bug report
description: Something in the app doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Profile → Settings, e.g. "1.2.0 (patch 4)"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once
